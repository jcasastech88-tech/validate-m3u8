<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HLS Stream Tokenizer V1</title>
    <style>
        :root { --bg-color: #0d1117; --card-bg: #161b22; --accent-color: #38bdf8; --text-color: #c9d1d9; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background-color: var(--card-bg); padding: 30px; border-radius: 12px; width: 100%; max-width: 500px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        h1 { font-size: 1.5rem; color: #fff; margin-bottom: 20px; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 0.9rem; }
        textarea { width: 100%; height: 90px; background: #0d1117; border: 1px: solid #30363d; color: #fff; border-radius: 6px; padding: 10px; box-sizing: border-box; resize: none; font-size: 0.85rem; }
        button { background-color: var(--accent-color); color: #0d1117; border: none; padding: 12px; width: 100%; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 1rem; transition: opacity 0.2s; }
        button:hover { opacity: 0.9; }
        .result-box { margin-top: 20px; background: #0d1117; border: 1px solid #30363d; padding: 15px; border-radius: 6px; display: none; word-break: break-all; font-size: 0.9rem; }
        .result-box.active { display: block; }
        .copy-btn { margin-top: 10px; background: transparent; border: 1px solid var(--accent-color); color: var(--accent-color); padding: 8px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>HLS Stream Tokenizer</h1>
        
        <div class="form-group">
            <label for="urlInput">Pegá tu URL .m3u8 o stream original:</label>
            <textarea id="urlInput" placeholder="https://ejemplo.com/stream/.../master.m3u8"></textarea>
        </div>

        <button onclick="generarEnlaceHLS()">Generar Enlace Inteligente</button>

        <div id="resultBox" class="result-box">
            <div style="font-size: 0.8rem; color: #8b949e; margin-bottom: 5px;">Enlace Protegido / Proxy:</div>
            <div id="resultUrl"></div>
            <button class="copy-btn" onclick="copiarAlPortapapeles()">Copiar Enlace</button>
        </div>
    </div>

    <script>
        function generarEnlaceHLS() {
            const rawUrl = document.getElementById('urlInput').value.trim();
            const resultBox = document.getElementById('resultBox');
            const resultUrlDiv = document.getElementById('resultUrl');

            if (!rawUrl) {
                alert("Por favor, ingresa una URL .m3u8 válida.");
                return;
            }

            // REEMPLAZA ESTA URL CON LA DE TU NUEVO WORKER DE CLOUDFLARE
            const workerDomain = "https://TU-NUEVO-WORKER.workers.dev";
            const enlaceInteligente = `${workerDomain}/?url=${encodeURIComponent(rawUrl)}`;

            resultUrlDiv.innerText = enlaceInteligente;
            resultBox.classList.add('active');
        }

        function copiarAlPortapapeles() {
            const textToCopy = document.getElementById('resultUrl').innerText;
            navigator.clipboard.writeText(textToCopy).then(() => {
                alert("¡Enlace copiado al portapapeles!");
            });
        }
    </script>
</body>
</html>
